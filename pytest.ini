[pytest]
# Tests live in tests/, but import the app/package from the repo root
# (import app; from scene_understanding... import ...) -- pythonpath makes
# that resolve regardless of where pytest is invoked from, instead of
# relying on each test file's own directory being on sys.path by accident
# of location (which is how this worked before the tests/ move).
pythonpath = .
testpaths = tests
